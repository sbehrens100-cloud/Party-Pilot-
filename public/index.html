<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PartyPilot – Feiern fertig gepackt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F3EE;--surface:#FFFFFF;--surface2:#FAF8F4;--ink:#17150F;--muted:#7A746A;--line:#E7E1D7;--line2:#D9D1C3;
  --accent:#A8844C;--accent-ink:#FFFFFF;--accent-soft:#F3EBDD;--gold2:#C9A96E;--sun:#F3EBDD;--sun-ink:#6B5229;
  --good:#3F6B4F;--good-bg:#E9F0EA;--warn:#8A6421;--warn-bg:#F6EEDC;--bad:#9A3B32;--bad-bg:#F6E6E3;--info:#45556B;--info-bg:#ECEFF3;
  --shadow:0 1px 2px rgba(23,21,15,.04),0 8px 28px -12px rgba(23,21,15,.12);
  --shadow-lg:0 2px 4px rgba(23,21,15,.04),0 24px 48px -20px rgba(23,21,15,.22);
  --f-display:'Fraunces','Times New Roman',Georgia,serif;
  --f-body:'Manrope','Helvetica Neue',Arial,sans-serif;
  --f-mono:'Manrope','Helvetica Neue',Arial,sans-serif;
  --r:18px;color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#11100E;--surface:#1A1916;--surface2:#211F1B;--ink:#F2EDE4;--muted:#A39B8E;--line:#2E2B26;--line2:#3B3731;
    --accent:#C9A96E;--accent-ink:#17150F;--accent-soft:#2A2419;--sun:#2A2419;--sun-ink:#E2CC9F;
    --good:#8DBB9A;--good-bg:#1C2A21;--warn:#E0B972;--warn-bg:#2E2617;--bad:#E39A90;--bad-bg:#2F1C19;--info:#AFBBCB;--info-bg:#1E232A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -12px rgba(0,0,0,.6);--shadow-lg:0 24px 48px -20px rgba(0,0,0,.7);color-scheme:dark}
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(20px,env(safe-area-inset-right,0px)) calc(56px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.08;letter-spacing:-.015em}
h3{font-size:1.25rem;letter-spacing:-.005em}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
small,.muted{color:var(--muted)}
.mono{font-family:var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
::selection{background:var(--accent-soft)}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 28px;padding:22px 0 18px;border-bottom:1px solid var(--line);margin-bottom:34px}
.brand{font-family:var(--f-display);font-weight:400;font-size:1.6rem;letter-spacing:-.01em;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:var(--ink)}
.brand i{width:34px;height:34px;border-radius:50%;border:1px solid var(--accent);display:inline-grid;place-items:center;font-style:normal}
.brand i::after{content:"P";font-family:var(--f-display);font-style:italic;font-size:1.05rem;color:var(--accent);line-height:1}
.brand .adm{font-family:var(--f-body);font-size:.62rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 9px;letter-spacing:.14em}
.tabs{display:flex;gap:2px 22px;flex-wrap:wrap;background:none;border:0;padding:0}
.tab{border:0;background:transparent;padding:6px 0;border-radius:0;font-weight:600;font-size:.86rem;color:var(--muted);letter-spacing:.02em;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Schritte */
.steps{display:flex;flex-wrap:wrap;gap:6px 26px;list-style:none;margin:0 0 34px;padding:0}
.steps button{border:0;background:none;padding:4px 0;font-size:.82rem;font-weight:600;color:var(--muted);display:flex;gap:10px;align-items:center;letter-spacing:.03em}
.steps button b{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-weight:600;font-size:.78rem}
.steps .on button{color:var(--ink)}
.steps .on button b{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.steps .done button{color:var(--ink)}
.steps .done button b{border-color:var(--accent);color:var(--accent)}
.steps button:disabled{cursor:default}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:end;margin-bottom:36px}
.hero h1{font-size:clamp(2.6rem,7.2vw,5rem);font-weight:300;line-height:1.02;letter-spacing:-.03em}
.hero h1 em{font-style:italic;color:var(--accent);background:none}
.hero p{color:var(--muted);max-width:44ch;margin-top:18px;font-size:1.02rem}
.hero>div:first-child::before{content:"Eventplanung · Rhein-Neckar";display:block;font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.nl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;min-width:0;box-shadow:var(--shadow)}
.nl label{font-family:var(--f-display);font-size:1.1rem}

/* Formulare */
textarea,input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=password],input[type=url],select{
  width:100%;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:0;background:none;-webkit-appearance:auto;appearance:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.74rem;font-weight:600;background:var(--accent-soft);color:var(--sun-ink);border-radius:999px;padding:3px 11px;border:0;letter-spacing:.02em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;min-width:0;box-shadow:var(--shadow)}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.fld{display:grid;gap:7px;align-content:start;min-width:0}
.fld>span{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:.88rem;cursor:pointer;transition:border-color .2s,background .2s}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0;flex:none}

/* Buttons */
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 24px;font-weight:600;font-size:.9rem;letter-spacing:.03em;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .15s,background .2s,box-shadow .2s,opacity .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:currentColor}
.btn.sm{padding:7px 15px;font-size:.8rem}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
.stack{display:grid;gap:18px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px 24px;margin:4px 0 24px}
.sec-h h2{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:300;letter-spacing:-.02em}
.err,.note,.ok{border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:600;font-size:.9rem}
.err{background:var(--bad-bg);color:var(--bad)}
.note{background:var(--warn-bg);color:var(--warn)}
.ok{background:var(--good-bg);color:var(--good)}
.info{background:var(--surface2);color:var(--muted);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:12px;padding:13px 16px;font-size:.88rem}

/* Pakete */
.passes{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px;align-items:start}
.pass{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);overflow:hidden}
.pass.rec{border-color:var(--accent);box-shadow:var(--shadow-lg)}
.pass.rec::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold2),var(--accent))}
.pass-h{padding:28px 26px 20px;display:grid;gap:8px}
.kicker{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.tag{background:none;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 10px;font-weight:700;letter-spacing:.14em}
.pass h3{font-size:2.1rem;font-weight:300;font-style:italic}
.price{font-family:var(--f-display);font-weight:300;font-size:2.6rem;letter-spacing:-.03em;font-variant-numeric:lining-nums tabular-nums;line-height:1.05}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.72rem;font-weight:600;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--sun-ink)}
.pill.neutral{background:transparent;color:var(--muted);border-color:var(--line2)}
.perf{border-top:1px solid var(--line);margin:0 26px}
.items{list-style:none;margin:0;padding:20px 26px;display:grid;gap:14px;flex:1}
.items li{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;align-items:baseline}
.items .k{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
.items .v{display:grid;min-width:0;overflow-wrap:anywhere;line-height:1.35}
.items .v b{font-weight:600}
.items .v small{font-size:.78rem;margin-top:2px}
.items .pr{font-size:.88rem;font-variant-numeric:tabular-nums;font-weight:500}
.why{padding:0 26px 18px;font-size:.86rem;color:var(--muted);line-height:1.55}
.pass-f{padding:0 26px 26px;display:grid;gap:8px}

/* Anpassen */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:grid;gap:12px;min-width:0;box-shadow:var(--shadow)}
.blk.empty{background:transparent;border-style:dashed;border-color:var(--line2);box-shadow:none}
.blk-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.blk-h h3{font-size:.72rem;font-family:var(--f-body);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.cur{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 18px}
.cur>div{min-width:0;overflow-wrap:anywhere}
.cur b{font-family:var(--f-display);font-weight:400;font-size:1.35rem;letter-spacing:-.01em}
.cur .price{font-size:1.7rem!important}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
details summary{cursor:pointer;font-weight:600;font-size:.84rem;color:var(--accent);letter-spacing:.02em;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ "}
details[open] summary::before{content:"– "}
details ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.alt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface2)}
.alt>div{display:grid;min-width:0;overflow-wrap:anywhere}
.alt.off{opacity:.55}
.delta{font-size:.84rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:16px}
.sum .panel{display:grid;gap:14px}
.lines{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lines li{display:flex;justify-content:space-between;gap:14px;font-size:.92rem}
.lines .n{overflow-wrap:anywhere;min-width:0}
.lines .m{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.lines.kv .n{flex:none;color:var(--muted)}.lines.kv .m{white-space:normal;text-align:right}
.lines .tot{border-top:1px solid var(--ink);padding-top:12px;margin-top:4px;align-items:baseline}
.lines .tot .n{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.lines .tot .m{font-family:var(--f-display);font-size:1.75rem;font-weight:300;letter-spacing:-.02em}
.lines .dis .m{color:var(--good)}

/* Ablauf */
.tl{list-style:none;margin:0;padding:0;display:grid;position:relative}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;padding:10px 0;position:relative}
.tl li::before{content:"";position:absolute;left:62px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--surface);border:1px solid var(--accent)}
.tl li::after{content:"";position:absolute;left:65px;top:28px;bottom:-10px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li>div{padding-left:18px}
.tl time{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;font-size:.88rem}
.tl .evt{font-weight:600}

/* Admin */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:26px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:6px;min-width:0;box-shadow:var(--shadow)}
.kpi .l{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.kpi .n{font-family:var(--f-display);font-weight:300;font-size:clamp(1.5rem,5vw,2.1rem);letter-spacing:-.03em;font-variant-numeric:lining-nums tabular-nums;line-height:1.1}
.kpi small{font-size:.78rem}
.kpi.hi{border-color:var(--accent)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
.tbl table{min-width:660px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
th{font-size:.64rem;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover td{background:var(--surface2)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;margin-bottom:24px}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;margin-bottom:26px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pipe div{background:var(--surface);padding:14px;display:grid;gap:4px}
.pipe b{font-family:var(--f-display);font-weight:300;font-size:1.7rem;line-height:1}
.pipe small{font-size:.72rem;line-height:1.3}
.stagebar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 6px}
.stagebar span{font-size:.7rem;font-weight:600;padding:4px 11px;border-radius:999px;color:var(--muted);border:1px solid var(--line2);letter-spacing:.02em}
.stagebar span.done{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.stagebar span.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.todo:last-child{border-bottom:0}
.todo input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.todo .d{font-size:.76rem;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.todo .d.late{color:var(--bad);font-weight:700}
.item{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px;background:var(--surface2)}
.item .hd{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.item .hd .mono{font-size:.84rem;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-height:300px;overflow:auto}
.log li{font-size:.88rem;border-left:1px solid var(--accent);padding-left:12px}
.log time{font-size:.72rem;color:var(--muted);display:block;letter-spacing:.03em}
.foot{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;letter-spacing:.02em}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:none;font-size:.8rem;letter-spacing:.04em}
.linkbtn:hover{color:var(--accent)}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:1.25rem;padding:0 2px;color:var(--line2);line-height:1}
.stars button.on{color:var(--accent)}
.center{max-width:420px;margin:48px auto}
.center h2{font-weight:300}
@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr);gap:28px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .sum{position:static}
  .panel{padding:20px}
  .top{margin-bottom:26px}
}
@media (prefers-reduced-motion:no-preference){.pass{transition:transform .25s ease,box-shadow .25s ease}.pass:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}}
@media print{.top,.foot,.btn,.steps{display:none!important}body{background:#fff}.panel,.blk,.kpi{box-shadow:none}}
/* Symbole */
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Einstieg & große Auswahl */
.intro{margin:4px 0 30px;display:grid;gap:14px;max-width:780px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.intro h1{font-size:clamp(2.3rem,6.2vw,4.2rem);font-weight:300;line-height:1.04;letter-spacing:-.03em}
.intro h1 em{font-style:italic;color:var(--accent)}
.intro p{color:var(--muted);font-size:1.1rem;max-width:58ch}
.needs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.need{position:relative;text-align:left;display:grid;gap:10px;align-content:start;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:24px 24px 22px;min-height:196px;box-shadow:var(--shadow);transition:border-color .2s,background .2s,transform .15s}
.need:hover{border-color:var(--gold2);transform:translateY(-2px)}
.need.on{border-color:var(--accent);background:var(--accent-soft)}
.need-ic{width:58px;height:58px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);background:var(--surface);flex:none}
.need-ic .ic{width:28px;height:28px}
.need-t{font-family:var(--f-display);font-size:1.6rem;line-height:1.1;letter-spacing:-.01em}
.need-d{color:var(--muted);font-size:1rem;line-height:1.45}

function dist(a,b){
  const A=CITIES[a],B=CITIES[b];if(!A||!B)return 999;

  cfgAll=cfgAll||{};const g=+b.guests||0,cs=(cfgAll.catering||{}).style,gs=(cfgAll.getraenke||{}).style,cats=b.cats||{};
  const st={service:Math.max(1,Math.ceil(g/(cs==='menue'?12:25)))};

function priceOf(p,b,cfg){
  cfg=cfg||{};
  const h=+b.hours,g=+b.guests,dow=dInfo(b.date).dow,pr=Object.assign({},p.price||{});let amt=0,calc='',f=1;
  const st=cfg.style&&p.cat!=='location'?styleOf(p.cat,cfg.style):null,ov=st&&p.optPrice&&p.optPrice[st[0]];
  if(ov&&(ov.base!=null||ov.pp!=null)){if(ov.base!=null)pr.base=+ov.base;if(ov.pp!=null)pr.pp=+ov.pp}else if(st&&st[4])f=st[4];
  switch(p.cat){
    case 'location':amt=pr.base||0;calc='Miete inkl. 6 Stunden';if(h>6){amt+=100*(h-6);calc+=` + ${h-6} h × 100 €`}
      if(dow>=1&&dow<=4){amt*=0.9;calc+=' · Wochentag −10 %'}break;
    case 'catering':amt=Math.max(pr.min||0,(pr.pp||0)*g);calc=`${pr.pp||0} € × ${g} Gäste`+((pr.pp||0)*g<(pr.min||0)?` (Mindestumsatz ${fmt(pr.min)})`:'');break;
    case 'getraenke':amt=(pr.base||0)+(pr.pp||0)*g;calc=`${fmt(pr.base||0)} Grundpreis + ${pr.pp||0} € × ${g} Gäste`;break;
    case 'dj':{const dh=Math.max(1,h-1);amt=(pr.base||0)+90*Math.max(0,dh-5);calc='5 Stunden inklusive'+(dh>5?` + ${dh-5} h × 90 €`:'');break}
    case 'foto':{if(pr.hourly&&cfg.style!=='fotobox'){const fh=Math.min(h,8);amt=(pr.base||0)+pr.hourly*Math.max(0,fh-4);calc='4 Stunden inklusive'+(fh>4?` + ${fh-4} h × ${pr.hourly} €`:'')}else{amt=pr.base||0;calc='Pauschale für die Feier'}break}
    case 'deko':amt=(pr.base||0)+(pr.pp||0)*g;calc=`${fmt(pr.base||0)} + ${pr.pp||0} € × ${g} Gäste`;break;

  }

  (cfg.extras||[]).forEach(k=>{const ex=extraOf(p.cat,k);if(!ex)return;const v=extraPrice(p,ex,g);amt+=v;calc+=` + ${ex[1]} ${fmt(v)}`});
  return{amt:Math.round(amt/5)*5,calc};
}
function locRange(p){

  return p.cap&&p.cap[1]?[p.cap[0]||0,p.cap[1]]:null;
}
const roomsFit=(p,g)=>(p.rooms||[]).filter(r=>+r.max&&g>=(+r.min||0)&&g<=+r.max);
function locFits(p,g){if((p.rooms||[]).some(r=>+r.max))return roomsFit(p,g).length>0;return!(p.cap&&(g<p.cap[0]||g>p.cap[1]))}

function reasonFor(p,b,ctx){
  ctx=ctx||{};
  if(p.status==='Pausiert')return'pausiert';
  if(SET().onlyPartners&&p.status!=='Partner')return'noch kein Vertragspartner';
  if(p.cat==='location'){const d=dist(b.city,p.city);if(d>b.radius)return`${d} km entfernt (Umkreis ${b.radius} km)`}
  else if(!p.virtual){const d=dist(b.city,p.city);const km=+p.km||40;if(d>km)return`fährt nur ${km} km (${d} km)`}
  if((p.blocked||[]).includes(b.date))return'an diesem Tag gesperrt';
  if(bookedElsewhere(p.virtual?p.parent:p.id,b.date,ctx.exclude))return'an diesem Tag bereits gebucht';
  if(p.cat==='location'&&!locFits(p,+b.guests)){const rg=locRange(p);return rg?`nur für ${rg[0]} bis ${rg[1]} Gäste`:'passt nicht zur Gästezahl'}
  const cs=ctx.cfg&&ctx.cfg.style;
  if(cs&&Array.isArray(p.opts)&&p.opts.length&&!p.opts.includes(cs)){const s=styleOf(p.cat,cs);return'bietet nicht: '+(s?s[1]:cs)}
  if(p.cat==='catering'){
    if(p.maxG&&b.guests>p.maxG)return`max. ${p.maxG} Gäste`;
    const miss=(b.diets||[]).filter(x=>!(p.diets||[]).includes(x));if(miss.length)return`bietet nicht: ${miss.join(', ')}`;
    if(ctx.loc){
      if(p.virtual&&p.parent!==ctx.loc.id)return'nur mit eigener Location';
      if(!p.virtual&&ctx.loc.ext===false)return'Location erlaubt kein Fremd-Catering';
      if(!p.virtual&&!ctx.loc.kitchen&&!p.mobile)return'Location ohne Küche';
    }else if(p.virtual)return'nur mit eigener Location';
  }
  return null;
}
function cands(cat,b,ctx){

  if(cat==='catering'&&ctx.loc&&ctx.loc.inhouse)list=[inhouseOf(ctx.loc)].concat(list);
  return list.map(p=>{const pr=priceOf(p,b,ctx.cfg);return{p,price:pr.amt,calc:pr.calc,reason:reasonFor(p,b,ctx)}}).sort((x,y)=>x.price-y.price);

function pick(all,tier,b,avoid){
  const pr=all.map(x=>x.price),mn=Math.min(...pr),mx=Math.max(...pr);
  const sc=x=>{
    const r=ratingOf(x.p),q=(r==null?4.3:r)-4,s=(x.p.tags||[]).includes(b.style)?1:0,n=mx>mn?(x.price-mn)/(mx-mn):0;
    const bonus=x.p.status==='Partner'?1:x.p.status==='Angefragt'?.4:0,pen=avoid&&avoid.includes(x.p.id)?.3:0;
    if(tier==='spar')return -x.price+q*10+bonus*20;
    if(tier==='beliebt')return .35*q+.35*s+.2*(1-n)+.1*bonus-pen;
    return .35*q+.35*s+.2*n+.1*bonus-pen;
  };
  return all.reduce((a,x)=>sc(x)>sc(a)?x:a);
}
function totals(items){
  const st=SET(),sum=items.reduce((a,i)=>a+i.price,0);
  const disc=items.length>=st.bundleMin?Math.round(sum*st.bundle/100):0;
  const net=sum-disc,fee=Math.min(Math.round(net*st.fee/100),st.feeCap),total=net+fee;
  let comm=0;items.forEach(i=>{comm+=Math.round(i.price*(i.comm!=null?i.comm:commOf(i.p||getP(i.pid)||{cat:i.cat}))/100)});
  return{sum,disc,net,fee,total,deposit:Math.round(total*st.deposit/100),comm,revenue:comm+fee-disc,perGuest:0};
}
const selItems=sel=>ORDER.filter(c=>sel[c]).map(c=>({cat:c,p:sel[c].p,pid:sel[c].p.id,price:sel[c].price,room:sel[c].room||''}));
function fit(sel,b,cfgAll){
  cfgAll=cfgAll||{};let guard=40;
  while(b.budget&&totals(selItems(sel)).total>b.budget&&guard--){
    let best=null;
    for(const c of Object.keys(sel)){
      const ctx={loc:c==='location'?null:sel.location&&sel.location.p,cfg:cfgAll[c]};
      const lower=cands(c,b,ctx).filter(x=>!x.reason&&x.price<sel[c].price);
      if(!lower.length)continue;
      const a=lower[lower.length-1];
      if(c==='location'&&sel.catering&&reasonFor(sel.catering.p,b,{loc:a.p,cfg:cfgAll.catering}))continue;
      const save=sel[c].price-a.price,loss=Math.max(.05,((ratingOf(sel[c].p)||4.3)-(ratingOf(a.p)||4.3))+.3);
      if(!best||save/loss>best.v)best={c,a,v:save/loss};
    }
    if(!best)break;
    sel[best.c]=best.a;
  }
}
function buildPackage(tier,b,avoid,cfgAll){
  cfgAll=cfgAll||{};const sel={},missing=[];let loc=null;
  for(const c of ORDER.filter(c=>b.cats[c])){
    const all=cands(c,b,{loc:c==='location'?null:loc,cfg:cfgAll[c]}).filter(x=>!x.reason);
    if(!all.length){missing.push(c);continue}
    sel[c]=pick(all,tier,b,avoid);
    if(c==='location')loc=sel[c].p;
  }
  if(tier!=='premium')fit(sel,b,cfgAll);
  if(sel.location)sel.location.room=(roomsFit(sel.location.p,+b.guests)[0]||{}).name||'';
  return{tier,sel,missing,tot:totals(selItems(sel))};
}
function whyText(pk,b){
  const items=selItems(pk.sel),n=items.length;if(!n)return'Für diese Angaben gibt es kein passendes Paket.';
  const hits=items.filter(i=>(i.p.tags||[]).includes(b.style)).length,diff=b.budget-pk.tot.total;
  const bud=diff>=0?`${fmt(diff)} unter deinem Budget.`:`${fmt(-diff)} über deinem Budget.`;
  const miss=pk.missing.length?` Nicht verfügbar: ${pk.missing.map(c=>CATS[c].label).join(', ')}.`:'';
  if(pk.tier==='spar')return`Die günstigste passende Kombination im Umkreis von ${b.radius} km. ${bud}${miss}`;
  if(pk.tier==='beliebt')return`Beste Mischung aus Stil „${b.style}“, Qualität und Preis – ${hits} von ${n} Bausteinen passen genau zum Stil. ${bud}${miss}`;
  return`Die hochwertigste Auswahl, ${hits} von ${n} Bausteinen im Stil „${b.style}“. ${bud}${miss}`;
}

function tfmt(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}

function parseBriefing(txt){
  const t=txt.toLowerCase(),b=S.brief,found=[];let m;
  if((m=t.match(/(\d{1,3})\s*(gäste|gast|personen|leute|mitarbeiter|pers)/))){b.guests=Math.min(400,Math.max(10,+m[1]));found.push(b.guests+' Gäste')}
  if((m=t.match(/(\d[\d.]*)\s*(€|euro)/))){const v=parseInt(m[1].replace(/\./g,''),10);if(v>=300){b.budget=v;found.push('Budget '+fmt(v))}}
  for(const c of EVENT_CITIES){if(t.includes(c.toLowerCase())){b.city=c;found.push(c);break}}
  for(const s of STYLES){if(t.includes(s)||(s==='gemütlich'&&t.includes('gemuetlich'))){b.style=s;found.push('Stil '+s);break}}
  if(/bbq|grill|barbecue/.test(t)&&!found.some(f=>f.startsWith('Stil'))){b.style='gartenparty';found.push('Stil gartenparty')}
  const occ=[['geburtstag','Geburtstag'],['hochzeit','Hochzeit'],['jubiläum','Jubiläum'],['taufe','Taufe / Kommunion'],['kommunion','Taufe / Kommunion'],['weihnachtsfeier','Weihnachtsfeier (Firma)'],['sommerfest','Sommerfest (Firma)'],['teamevent','Teamevent (Firma)'],['firmenjubiläum','Firmenjubiläum'],['gartenparty','Gartenparty / BBQ'],['bbq','Gartenparty / BBQ'],['grill','Gartenparty / BBQ']];
  for(const [k,v] of occ){if(t.includes(k)){b.occasion=v;found.push(v);break}}
  const d=DIETS.filter(x=>t.includes(x));if(d.length){b.diets=d;found.push(d.join(', '))}
  if(/dj|musik/.test(t))b.cats.dj=true;
  if(/foto|fotobox/.test(t))b.cats.foto=true;
  if(/deko/.test(t))b.cats.deko=true;
  if(/personal|kellner|service/.test(t))b.cats.personal=true;
  if((m=t.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})?/))){
    const now=new Date();let y=m[3]?+m[3]:now.getFullYear();let dt=new Date(y,+m[2]-1,+m[1]);
    if(!m[3]&&dt<now)dt=new Date(y+1,+m[2]-1,+m[1]);
    if(!isNaN(dt)){b.date=iso(dt);found.push(dShort(b.date))}
  }
  return found;
}

function newId(){let id;do{id='PP-'+(1000+Math.floor(Math.random()*9000))}while(S.db.bookings.some(k=>k.id===id));return id}
function createBooking(brief,sel,co,opts){
  const items=selItems(sel).map(i=>({cat:i.cat,pid:i.pid,name:i.p.name,price:i.price,calc:sel[i.cat].calc,comm:commOf(i.p),status:'offen',paid:false,rating:null}));
  const k={id:opts&&opts.id||newId(),created:nowStr(),example:!!(opts&&opts.example),stage:'neu',brief:clone(brief),customer:clone(co),
    items,checks:{},log:[{t:nowStr(),txt:'Anfrage über die Website eingegangen.'}],feePaid:false};
  S.db.bookings.unshift(k);return k;
}
function bTot(k){return totals(k.items.filter(i=>i.status!=='abgelehnt'))}
function checklist(k){
  const out=[],ev=k.brief.date;
  const add=(arr,cat)=>arr.forEach((x,i)=>{const due=x[3]==='booked'?addDays(k.bookedAt||today(),3):addDays(ev,x[0]);out.push({key:(cat||'all')+':'+i,cat,days:x[3]==='booked'?-999:x[0],label:x[1],who:x[2],due})});
  add(CHECK_TPL._all,null);
  k.items.filter(i=>i.status!=='abgelehnt').forEach(i=>{if(CHECK_TPL[i.cat])add(CHECK_TPL[i.cat],i.cat)});
  return out.sort((a,b)=>a.days-b.days);
}
function openTasks(k){
  if(STAGE_IDX[k.stage]<STAGE_IDX.gebucht||k.stage==='storniert')return[];
  return checklist(k).filter(c=>!k.checks[c.key]);
}
function lateTasks(k){const t=today();return openTasks(k).filter(c=>c.due<t)}
function logB(k,txt){k.log.unshift({t:nowStr(),txt})}

function provCard(c,x){

    ${imgs.length>1?`<div class="thumbs">${imgs.map((u,i)=>`<button class="${i===gi?'on':''}" data-act="gal" data-id="${esc(p.id)}" data-i="${i}" aria-label="Bild ${i+1}">${imgTag(u)}</button>`).join('')}</div>`:''}</div>`;

    const feat=[p.kitchen?'Küche vorhanden':'',p.ext===false?'nur Hausgastronomie':'eigenes Catering möglich',p.inhouse?`Hausgastronomie ab ${p.inhouse} € p. P.`:''].filter(Boolean);
    ex+=`<div class="meta">${feat.map(f=>`<span class="pill neutral">${esc(f)}</span>`).join('')}</div>`;
  }else{
    const O=OPTS[c]||{},offered=[...(O.styles||[]),...(O.extras||[]),...(O.roles||[])].filter(o=>(p.opts||[]).includes(o[0]));
    if(offered.length)ex+=`<div class="meta">${offered.map(o=>`<span class="pill info">${esc(o[1])}</span>`).join('')}</div>`;
    const miss=((S.cfg[c]||{}).extras||[]).filter(k=>(p.opts||[]).length&&!p.opts.includes(k)).map(k=>(extraOf(c,k)||[])[1]).filter(Boolean);
    if(miss.length)ex+=`<small class="muted">Wird zusätzlich angefragt: ${esc(miss.join(', '))}</small>`;

function cockpitView(){
  const bs=S.db.bookings,act=bs.filter(k=>k.stage!=='storniert');
  const booked=act.filter(k=>STAGE_IDX[k.stage]>=STAGE_IDX.gebucht);
  const gmv=booked.reduce((a,k)=>a+bTot(k).total,0),exp=booked.reduce((a,k)=>a+bTot(k).revenue,0);
  const real=act.filter(k=>k.stage==='abgeschlossen').reduce((a,k)=>a+bTot(k).revenue,0);

function stageHint(k){
  const s=k.stage,its=k.items.filter(i=>i.status!=='abgelehnt');
  if(s==='neu')return'Schick jedem Dienstleister die Anfrage-Mail und setze ihn auf „angefragt“.';
  if(s==='angefragt'){const o=its.filter(i=>i.status!=='angenommen').length;return o?`${o} Dienstleister haben noch nicht zugesagt.`:'Alle haben zugesagt.'}
  if(s==='bestaetigt')return'Jetzt dem Kunden das Angebot schicken.';
  if(s==='angebot')return'Warten auf Zusage und Anzahlung des Kunden.';
  if(s==='gebucht'||s==='abstimmung'){const o=openTasks(k).filter(c=>c.days<0).length;return o?`${o} Aufgaben vor dem Event offen.`:'Alles vor dem Event erledigt.'}
  if(s==='final')return'Nach dem Event: auf „Durchgeführt“ setzen und bewerten.';
  if(s==='durchgefuehrt')return'Bewertungen eintragen, Provisionen einziehen.';
  return'';
}

function setPath(o,path,v){const ps=path.split('.');let x=o;for(let i=0;i<ps.length-1;i++){const k=ps[i];if(x[k]==null)x[k]=/^\d+$/.test(ps[i+1])?[]:{};x=x[k]}x[ps[ps.length-1]]=v}
function setField(el){
  const f=el.dataset.f,b=S.brief,v=el.type==='checkbox'?el.checked:el.value;
  if(f==='nl'){S.nlText=v;return}
  if(f==='pin'){S.pinInput=v;return}
  if(f.startsWith('pw:')){S.pw[f.slice(3)]=v;return}
  if(f==='note'){S.note=v;return}
  if(f==='imgurl'){S.imgUrl=v;return}
  if(f.startsWith('peopt:')){const k=f.slice(6),p=S.pe;p.opts=(p.opts||[]).filter(x=>x!==k);if(el.checked)p.opts.push(k);return}
  if(f.startsWith('peop:')){const [,k,fl]=f.split(':'),p=S.pe;p.optPrice=p.optPrice||{};const o=p.optPrice[k]=p.optPrice[k]||{};if(v==='')delete o[fl];else o[fl]=+v;return}
  if(f.startsWith('peroom:')){const [,i,fl]=f.split(':'),r=(S.pe.rooms||[])[+i];if(r)r[fl]=(fl==='min'||fl==='max')?(v===''?'':+v):v;return}
  if(f.startsWith('b:')){const k=f.slice(2);b[k]=['hours','radius','guests','budget'].includes(k)?(v===''?'':+v):v;return}
  if(f.startsWith('cat:')){b.cats[f.slice(4)]=el.checked;return}
  if(f.startsWith('diet:')){const d=f.slice(5);b.diets=b.diets.filter(x=>x!==d);if(el.checked)b.diets.push(d);return}
  if(f.startsWith('co:')){S.co[f.slice(3)]=v;updateReady();return}
  if(f.startsWith('track:')){S.track[f.slice(6)]=v;return}
  if(f.startsWith('flt:')){S.flt[f.slice(4)]=v;return}
  if(f.startsWith('calc:')){SET().calc[f.slice(5)]=+v;save();return}
  if(f.startsWith('cost:')){SET().costs[f.slice(5)]=+v||0;save();return}
  if(f.startsWith('setcomm:')){S.setDraft=S.setDraft||{};S.setDraft['comm.'+f.slice(8)]=+v;return}
  if(f.startsWith('setco:')){S.setDraft=S.setDraft||{};S.setDraft['company.'+f.slice(6)]=v;return}
  if(f.startsWith('setbool:')){S.setDraft=S.setDraft||{};S.setDraft[f.slice(8)]=el.checked;return}
  if(f.startsWith('set:')){S.setDraft=S.setDraft||{};S.setDraft[f.slice(4)]=+v;return}
  if(f.startsWith('petag:')){const t=f.slice(6),p=S.pe;p.tags=(p.tags||[]).filter(x=>x!==t);if(el.checked)p.tags.push(t);return}
  if(f.startsWith('pediet:')){const t=f.slice(7),p=S.pe;p.diets=(p.diets||[]).filter(x=>x!==t);if(el.checked)p.diets.push(t);return}
  if(f.startsWith('pebool:')){S.pe[f.slice(7)]=el.checked;return}
  if(f.startsWith('pe:')){
    const k=f.slice(3);
    if(k==='blocked'||k==='check'){S.pe[k]=v.split(',').map(x=>x.trim()).filter(Boolean);return}
    const isNum=el.type==='number';
    setPath(S.pe,k,isNum?(v===''?(k==='comm'||k==='inhouse'?'':null):+v):v);
    return;
  }
}

/* Bilder: im Browser verkleinern und auf den Server laden */
async function resizeImg(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Bild konnte nicht gelesen werden'));i.src=url});
    const M=1600,sc=Math.min(1,M/Math.max(img.width,img.height)),cv=document.createElement('canvas');
    cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',.84);
  }finally{URL.revokeObjectURL(url)}
}
function addImg(to,url){
  if(to==='pe'){S.pe.imgs=(S.pe.imgs||[]).concat(url);return'Bild hinzugefügt. Bitte unten auf „Speichern“ drücken.'}
  if(to.startsWith('room:')){const r=(S.pe.rooms||[])[+to.slice(5)];if(r)r.img=url;return'Raumbild hinzugefügt. Bitte unten auf „Speichern“ drücken.'}
  if(to.startsWith('opt:')){const st=SET();st.optImg=st.optImg||{};st.optImg[to.slice(4)]=url;save();return'Bild gespeichert.'}
}
async function uploadFiles(files,to){
  S.flash='Bild wird hochgeladen …';render();let msg='';
  try{for(const f of files){const data=await resizeImg(f);const d=await api('/api/admin/media',{method:'POST',body:{data}});msg=addImg(to,d.url)}S.flash=msg}
  catch(e){S.flash='Hochladen fehlgeschlagen: '+e.message}
  render();
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function csv(){
  const cols=['id','cat','name','city','addr','tel','mail','web','status','desc','price.base','price.pp','price.hourly','price.min','price.src','comm','km','opts','imgs','src','check','notes'];
  const g=(p,c)=>{const v=c.split('.').reduce((a,k)=>a==null?a:a[k],p);return Array.isArray(v)?v.join('; '):v==null?'':v};
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  return'﻿'+cols.join(';')+'\n'+S.db.providers.map(p=>cols.map(c=>q(g(p,c))).join(';')).join('\n');
}

    case 'login':{const v=($('#pin')||{}).value||S.pinInput;S.pinInput='';t.disabled=true;
      api('/api/login',{method:'POST',body:{password:v}}).then(loadAdmin).then(()=>{S.view='admin';S.aview='cockpit';S.err=null;location.hash='admin'})
        .catch(e=>{S.err=e.message;S.admin=false}).then(render);return}
    case 'logout':clearTimeout(saveTimer);(saveState==='pending'?flushSave():Promise.resolve()).then(()=>api('/api/logout',{method:'POST'})).catch(()=>{})
      .then(()=>{S.admin=false;S.view='host';S.akte=null;S.pe=null;if(location.hash)history.replaceState(null,'',location.pathname);return loadPublic()}).catch(()=>{}).then(render);return;
    case 'changePw':{const p=S.pw;S.pwMsg=null;if(p.new1!==p.new2){S.pwMsg={ok:false,t:'Die neuen Passwörter stimmen nicht überein.'};break}
      api('/api/admin/password',{method:'POST',body:{old:p.old,new:p.new1}}).then(()=>{S.pw={old:'',new1:'',new2:''};S.pwMsg={ok:true,t:'Passwort geändert. Andere Geräte wurden abgemeldet.'}})
        .catch(e=>{S.pwMsg={ok:false,t:e.message}}).then(render);return}
    case 'goto':S.step=+t.dataset.step;S.open=null;S.err=null;if(S.step===3)refreshAll();scrollTop();break;
    case 'toStep':{const n=+t.dataset.step;S.err=null;
      if(n===2&&!chosenCats().length){S.err='Wähle mindestens einen Punkt aus.';break}
      if(n===3){S.err=validateBrief();if(S.err)break;refreshAll()}
      if(n===4&&!selItems(S.sel).length)break;
      S.step=n;S.open=null;scrollTop();break}
    case 'need':{const c=t.dataset.cat;S.brief.cats[c]=!S.brief.cats[c];if(!S.brief.cats[c])delete S.sel[c];S.err=null;break}
    case 'occ':S.brief.occasion=t.dataset.v;break;
    case 'bstyle':S.brief.style=S.brief.style===t.dataset.v?'':t.dataset.v;break;
    case 'diet':{const d=t.dataset.v,b=S.brief;b.diets=b.diets.includes(d)?b.diets.filter(x=>x!==d):b.diets.concat(d);break}
    case 'parse':S.nlFound=parseBriefing(S.nlText);break;
    case 'openCat':{const c=t.dataset.cat;if(!c)break;S.open=c;const cfg=S.cfg[c]=S.cfg[c]||{};if(c==='personal'&&!cfg.staff){cfg.staff=recStaff(S.brief,S.cfg);refreshSel(c)}scrollTop();break}
    case 'closeCat':S.open=null;scrollTop();break;
    case 'skipCat':{const c=t.dataset.cat;S.brief.cats[c]=false;delete S.sel[c];S.open=null;if(!chosenCats().length)S.step=1;scrollTop();break}
    case 'style':{const c=t.dataset.cat,cfg=S.cfg[c]=S.cfg[c]||{};cfg.style=cfg.style===t.dataset.k?'':t.dataset.k;refreshSel(c);if(c==='catering'||c==='getraenke')refreshSel('personal');break}
    case 'extra':{const c=t.dataset.cat,cfg=S.cfg[c]=S.cfg[c]||{},k=t.dataset.k;cfg.extras=(cfg.extras||[]).includes(k)?cfg.extras.filter(x=>x!==k):(cfg.extras||[]).concat(k);refreshSel(c);break}
    case 'staff':{const cfg=S.cfg.personal=S.cfg.personal||{},st=Object.assign({},staffOf(cfg,S.brief)),k=t.dataset.k;st[k]=Math.max(0,Math.min(60,(+st[k]||0)+(+t.dataset.d)));cfg.staff=st;refreshSel('personal');break}
    case 'staffRec':{const cfg=S.cfg.personal=S.cfg.personal||{};cfg.staff=recStaff(S.brief,S.cfg);refreshSel('personal');break}
    case 'gal':S.gal[t.dataset.id]=+t.dataset.i;break;
    case 'room':{S.roomPick[t.dataset.id]=t.dataset.v;if(S.sel.location&&S.sel.location.p.id===t.dataset.id)S.sel.location.room=t.dataset.v;break}
    case 'pick':{const c=t.dataset.cat,x=cands(c,S.brief,ctxFor(c)).find(y=>y.p.id===t.dataset.id);if(!x||x.reason)break;
      if(c==='location')x.room=roomSel(x.p);S.sel[c]=x;if(c==='location')refreshSel('catering');S.open=null;scrollTop();break}
    case 'suggest':{const pk=suggestions().find(p=>p.tier===t.dataset.tier);if(!pk)break;S.sel={};ORDER.forEach(c=>{if(pk.sel[c])S.sel[c]=pk.sel[c]});
      if(pk.missing.length)S.notice='Für '+pk.missing.map(c=>CATS[c].label).join(', ')+' ist an deinem Termin niemand frei.';break}
    case 'request':{if(S.sending)return;S.sending=true;t.disabled=true;t.textContent='Wird gesendet …';S.err=null;
      const items=selItems(S.sel).map(i=>({cat:i.cat,pid:i.pid,price:i.price,calc:S.sel[i.cat].calc,cfg:S.cfg[i.cat]||{},room:i.room||'',detail:detailOf(i.cat,S.cfg[i.cat],i.room)}));
      api('/api/request',{method:'POST',body:{brief:S.brief,co:S.co,items}}).then(d=>{S.lastBooking=d.booking;S.bookingId=d.booking.id;S.step=5;scrollTop();
        if(S.admin)return loadAdmin();return loadPublic()}).catch(e=>{S.notice='Anfrage konnte nicht gesendet werden: '+e.message}).then(()=>{S.sending=false;render()});return}
    case 'newEvent':S.step=1;S.sel={};S.cfg={};S.open=null;S.roomPick={};S.brief=freshBrief();S.bookingId=null;S.co.privacy=false;scrollTop();break;
    case 'track':{const id=S.track.id.trim().toUpperCase(),m=S.track.mail.trim().toLowerCase();
      api('/api/track',{method:'POST',body:{id,mail:m}}).then(d=>{S.track.k=d.booking;S.track.res=d.booking?d.booking.id:'none'}).catch(e=>{S.track.k=null;S.track.res='none'}).then(render);return}
    case 'akte':S.view='admin';S.akte=t.dataset.k;S.note='';scrollTop();break;
    case 'closeAkte':S.akte=null;S.aview='anfragen';break;
    case 'stage':{const k=K();if(!k)break;const to=t.dataset.s,its=k.items.filter(i=>i.status!=='abgelehnt');
      if(to==='bestaetigt'&&its.some(i=>i.status!=='angenommen'))S.flash='Achtung: Noch nicht alle Dienstleister haben angenommen.';
      if(to==='final'&&openTasks(k).some(c=>c.days<0))S.flash='Achtung: Es sind noch Aufgaben vor dem Event offen.';
      if(to==='abgeschlossen'&&its.some(i=>!i.paid))S.flash='Hinweis: Nicht alle Provisionen sind als bezahlt markiert.';
      if(to==='gebucht'&&!k.bookedAt)k.bookedAt=today();
      const was=k.stage;k.stage=to;logB(k,`Status: ${STAGES[STAGE_IDX[was]]?STAGES[STAGE_IDX[was]][1]:was} → ${STAGES[STAGE_IDX[to]][1]}`);
      save();break}
    case 'istatus':{const k=K(),i=k&&k.items[+t.dataset.i];if(i){i.status=t.dataset.s;logB(k,`${i.name}: ${t.dataset.s}`);
      if(t.dataset.s==='angefragt'&&k.stage==='neu')k.stage='angefragt';
      const its=k.items.filter(x=>x.status!=='abgelehnt');if((k.stage==='angefragt'||k.stage==='neu')&&its.length&&its.every(x=>x.status==='angenommen')){k.stage='bestaetigt';logB(k,'Alle Dienstleister bestätigt.')}
      if(t.dataset.s==='abgelehnt')S.flash=`${i.name} hat abgelehnt – wähle unten über „Ersetzen durch …“ einen Ersatz.`;save()}break}
    case 'rate':{const k=K(),i=k&&k.items[+t.dataset.i];if(i){const p=S.db.providers.find(x=>x.id===String(i.pid).split('#')[0]);
      if(p){p.reviews=p.reviews||[];if(i.rating!=null){const ix=p.reviews.indexOf(i.rating);if(ix>=0)p.reviews.splice(ix,1)}p.reviews.push(+t.dataset.s)}
      i.rating=+t.dataset.s;logB(k,`Bewertung ${i.name}: ${i.rating} Sterne`);save()}break}
    case 'addItem':{const k=K();if(!k)break;const c=t.dataset.cat,loc=getP((k.items.find(x=>x.cat==='location'&&x.status!=='abgelehnt')||{}).pid);
      const ok=cands(c,k.brief,{exclude:k.id,loc:c==='location'?null:loc}).filter(x=>!x.reason);
      if(!ok.length){S.flash=`Kein freier Anbieter für ${CATS[c].label}.`;break}
      const x=pick(ok,'beliebt',k.brief);k.items.push({cat:c,pid:x.p.id,name:x.p.name,price:x.price,calc:x.calc,comm:commOf(x.p),status:'offen',paid:false,rating:null});
      k.brief.cats[c]=true;logB(k,`Baustein ergänzt: ${x.p.name}`);save();break}
    case 'addNote':{const k=K();if(k&&S.note.trim()){logB(k,S.note.trim());S.note='';save()}break}
    case 'cancel':{const k=K();if(k){k.stage='storniert';logB(k,'Storniert.');save()}break}
    case 'delB':{const k=K();if(!k)break;if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='Wirklich löschen?';return}
      S.db.bookings=S.db.bookings.filter(x=>x!==k);if(k.example)S.db.demoRemoved=true;S.akte=null;S.aview='anfragen';save();break}
    case 'print':try{window.print()}catch(e){}return;
    case 'newP':S.pe={id:'X'+Date.now().toString(36).toUpperCase(),cat:S.flt.cat||'location',name:'',city:'Heidelberg',status:'Lead',tags:[],price:{src:'vom Anbieter bestätigt'},cap:[10,100],kitchen:true,ext:true,mobile:true,diets:['vegetarisch'],km:40,check:[],blocked:[],opts:[],optPrice:{},imgs:[],rooms:[]};S.imgUrl='';S.err=null;break;
    case 'editP':{const p=S.db.providers.find(x=>x.id===t.dataset.id);if(p){S.pe=clone(p);S.imgUrl='';S.err=null;scrollTop()}break}
    case 'cancelP':S.pe=null;S.err=null;break;
    case 'saveP':{const p=S.pe;if(!p.name||!p.name.trim()){S.err='Bitte einen Namen eingeben.';break}
      ['comm','inhouse','maxG','km'].forEach(k=>{if(p[k]===''||p[k]==null)delete p[k]});
      if(p.cat!=='location'){delete p.cap;delete p.inhouse;delete p.rooms}
      else p.rooms=(p.rooms||[]).filter(r=>(r.name||'').trim()||+r.max);
      p.opts=(p.opts||[]).filter(k=>{const O=OPTS[p.cat]||{};return[...(O.styles||[]),...(O.extras||[]),...(O.roles||[])].some(o=>o[0]===k)});
      const op={};Object.entries(p.optPrice||{}).forEach(([k,v])=>{if(p.opts.includes(k)&&v&&(v.base!=null||v.pp!=null))op[k]=v});p.optPrice=op;p.imgs=p.imgs||[];
      const ix=S.db.providers.findIndex(x=>x.id===p.id);if(ix>=0)S.db.providers[ix]=p;else S.db.providers.push(p);S.pe=null;S.err=null;save();break}
    case 'imgDel':S.pe.imgs.splice(+t.dataset.i,1);break;
    case 'imgFirst':{const u=S.pe.imgs.splice(+t.dataset.i,1)[0];S.pe.imgs.unshift(u);break}
    case 'imgAddUrl':{const u=(S.imgUrl||'').trim();if(!/^https:\/\/[^\s"'<>]+$/.test(u)){S.err='Bitte einen Bild-Link mit https:// eingeben.';break}S.err=null;S.pe.imgs=(S.pe.imgs||[]).concat(u);S.imgUrl='';S.flash='Bild hinzugefügt. Bitte unten auf „Speichern“ drücken.';break}
    case 'roomAdd':S.pe.rooms=(S.pe.rooms||[]).concat({name:'',min:'',max:'',desc:'',img:''});break;
    case 'roomDel':S.pe.rooms.splice(+t.dataset.i,1);break;
    case 'optImgDel':{const st=SET();if(st.optImg)delete st.optImg[t.dataset.k];save();break}
    case 'delP':{if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='Wirklich löschen?';return}S.db.providers=S.db.providers.filter(x=>x.id!==S.pe.id);S.pe=null;save();break}
    case 'saveSet':{const d=S.setDraft||{},st=SET();
      for(const [k,v] of Object.entries(d))setPath(st,k,v);
      S.setDraft=null;save();S.flash='Gespeichert.';break}
    case 'export':download('partypilot-daten-'+today()+'.json',JSON.stringify(S.db,null,1),'application/json');return;
    case 'exportCsv':download('partypilot-dienstleister-'+today()+'.csv',csv(),'text/csv;charset=utf-8');return;
    case 'delDemo':S.db.bookings=S.db.bookings.filter(k=>!k.example);S.db.demoRemoved=true;save();S.flash='Beispiel-Akte gelöscht.';break;
    case 'resetP':{if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='Sicher? Eigene Änderungen gehen verloren';return}api('/api/admin/default-providers').then(d=>{S.db.providers=d.providers;save();S.flash='Datenbank zurückgesetzt.'}).catch(e=>{S.flash='Fehler: '+e.message}).then(render);return}
  }
  render();
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.f){setField(el);if(el.type==='range'){const lb=el.closest('label');const b=lb&&lb.querySelector('b');if(b)b.textContent=el.dataset.f==='calc:value'?fmt(el.value):el.value}}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.f){setField(el);if(el.dataset.r!==undefined)render();return}
  const a=el.dataset&&el.dataset.actChange;if(!a)return;
  const k=S.db.bookings.find(x=>x.id===el.dataset.k);
  if(a==='check'&&k){k.checks[el.dataset.c]=el.checked;save();render()}
  else if(a==='paid'&&k){const i=k.items[+el.dataset.i];i.paid=el.checked;logB(k,`Provision ${i.name}: ${el.checked?'bezahlt':'offen'}`);save();render()}
  else if(a==='replace'&&k&&el.value){
    const i=k.items[+el.dataset.i],loc=getP((k.items.find(x=>x.cat==='location'&&x.status!=='abgelehnt'&&x!==i)||{}).pid);
    const x=cands(i.cat,k.brief,{exclude:k.id,cfg:i.cfg,loc:i.cat==='location'?null:loc}).find(y=>y.p.id===el.value);
    if(x){logB(k,`${i.name} ersetzt durch ${x.p.name}`);Object.assign(i,{pid:x.p.id,name:x.p.name,price:x.price,calc:x.calc,comm:commOf(x.p),status:'offen',rating:null,paid:false});save();render()}
  }
  else if(a==='upload'&&el.files&&el.files.length){uploadFiles([...el.files],el.dataset.to)}
  else if(a==='import'&&el.files&&el.files[0]){
    const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.providers||!d.bookings)throw 0;S.db.providers=d.providers;S.db.bookings=d.bookings;S.db.set=Object.assign(clone(DEFAULT_SET),d.set||{});S.db.demoRemoved=!!d.demoRemoved;save();S.flash='Import erfolgreich.'}catch(err){S.flash='Datei konnte nicht gelesen werden.'}render()};r.readAsText(el.files[0]);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin'){e.preventDefault();const b=document.querySelector('[data-act="login"]');if(b)b.click()}});
function fromHash(){const h=location.hash.slice(1);if(h==='admin'){S.view=S.admin?'admin':'login'}else if(h==='verfolgen')S.view='track'}
async function init(){render();await load();fromHash();render();window.addEventListener('hashchange',()=>{fromHash();render()})}
if(typeof document!=='undefined')init();
</script>
</body>
